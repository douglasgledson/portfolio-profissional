name: GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public checkout
        shell: bash
        run: |
          unexpected="$(git ls-tree --name-only HEAD | grep -v -E '^(\.github|site)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "The Pages workflow expects the isolated public checkout."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment